[project]
name = "my-comfy-wrapper"
version = "0.1.0"
description = "CLI-first batch wrapper for ComfyUI workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
my-comfy-wrapper = "my_comfy_wrapper.cli:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
